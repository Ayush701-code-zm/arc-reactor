name: m1-linux

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install C++ / gRPC tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config \
            protobuf-compiler protobuf-compiler-grpc \
            libprotobuf-dev libgrpc++-dev

      - name: M1/M2 smoke with cgroup required
        env:
          TINY_REQUIRE_CGROUP: "1"
          TINY_CGROUP_PARENT: "/sys/fs/cgroup"
          TINY_DB: ${{ github.workspace }}/data/tiny-ci.db
          TINY_RUNTIME_ADDR: "127.0.0.1:50051"
          TINY_API_ADDR: "127.0.0.1:8080"
        run: |
          sudo -E env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            TINY_REQUIRE_CGROUP=1 \
            TINY_CGROUP_PARENT=/sys/fs/cgroup \
            TINY_DB="$TINY_DB" \
            TINY_RUNTIME_ADDR="$TINY_RUNTIME_ADDR" \
            TINY_API_ADDR="$TINY_API_ADDR" \
            bash scripts/m1-smoke-linux.sh

      - name: M3 volume smoke with cgroup required
        env:
          TINY_REQUIRE_CGROUP: "1"
          TINY_CGROUP_PARENT: "/sys/fs/cgroup"
          TINY_M3_DB: ${{ github.workspace }}/data/tiny-m3-ci.db
          TINY_M3_RUNTIME_ADDR: "127.0.0.1:15051"
          TINY_M3_API_ADDR: "127.0.0.1:18080"
          TINY_M3_IMAGE_ROOT: ${{ github.workspace }}/data/images-m3
          TINY_M3_VOLUME_ROOT: ${{ github.workspace }}/data/volumes-m3
        run: |
          sudo apt-get install -y --no-install-recommends e2fsprogs
          sudo -E env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            TINY_REQUIRE_CGROUP=1 \
            TINY_CGROUP_PARENT=/sys/fs/cgroup \
            TINY_M3_DB="$TINY_M3_DB" \
            TINY_M3_RUNTIME_ADDR="$TINY_M3_RUNTIME_ADDR" \
            TINY_M3_API_ADDR="$TINY_M3_API_ADDR" \
            TINY_M3_IMAGE_ROOT="$TINY_M3_IMAGE_ROOT" \
            TINY_M3_VOLUME_ROOT="$TINY_M3_VOLUME_ROOT" \
            bash scripts/m3-smoke-linux.sh
