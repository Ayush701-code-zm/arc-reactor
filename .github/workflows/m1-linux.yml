name: m1-linux

# Runs on a real Ubuntu runner (not Docker Desktop) so cgroup v2 can be required.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install C++ tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++

      - name: M1 smoke with cgroup required
        env:
          TINY_REQUIRE_CGROUP: "1"
          TINY_CGROUP_PARENT: "/sys/fs/cgroup"
          TINY_DB: ${{ github.workspace }}/data/tiny-ci.db
          TINY_RUNTIME_ADDR: "127.0.0.1:50051"
        # Root can vacate /sys/fs/cgroup and enable +cpu +memory. The runner user cannot mkdir under system.slice.
        run: |
          sudo -E env \
            "PATH=$PATH" \
            "HOME=$HOME" \
            TINY_REQUIRE_CGROUP=1 \
            TINY_CGROUP_PARENT=/sys/fs/cgroup \
            TINY_DB="$TINY_DB" \
            TINY_RUNTIME_ADDR="$TINY_RUNTIME_ADDR" \
            bash scripts/m1-smoke-linux.sh
