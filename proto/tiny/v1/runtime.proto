syntax = "proto3";

package tiny.v1;

option go_package = "github.com/ayushanand/tiny-aws/control-plane/gen/tiny/v1;tinyv1";

service RuntimeService {
  rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  rpc InspectInstance(InspectInstanceRequest) returns (InspectInstanceResponse);
  rpc StartInstance(StartInstanceRequest) returns (StartInstanceResponse);
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse);
  rpc DeleteInstance(DeleteInstanceRequest) returns (DeleteInstanceResponse);
}

enum InstanceStatus {
  INSTANCE_STATUS_UNSPECIFIED = 0;
  INSTANCE_STATUS_PENDING = 1;
  INSTANCE_STATUS_RUNNING = 2;
  INSTANCE_STATUS_STOPPING = 3;
  INSTANCE_STATUS_STOPPED = 4;
  INSTANCE_STATUS_FAILED = 5;
}

message Instance {
  string id = 1;
  string name = 2;
  string image = 3;
  uint32 cpu = 4;
  uint64 memory_bytes = 5;
  InstanceStatus status = 6;
  int32 pid = 7;
  string error_message = 8;
}

message CreateInstanceRequest {
  string id = 1;
  string name = 2;
  string image = 3;
  uint32 cpu = 4;
  uint64 memory_bytes = 5;
}

message CreateInstanceResponse {
  string id = 1;
  InstanceStatus status = 2;
  int32 pid = 3;
  string error_message = 4;
}

message ListInstancesRequest {}

message ListInstancesResponse {
  repeated Instance instances = 1;
}

message InspectInstanceRequest {
  string id = 1;
}

message InspectInstanceResponse {
  Instance instance = 1;
}

message StartInstanceRequest {
  string id = 1;
}

message StartInstanceResponse {
  string id = 1;
  InstanceStatus status = 2;
  int32 pid = 3;
  string error_message = 4;
}

message StopInstanceRequest {
  string id = 1;
}

message StopInstanceResponse {
  string id = 1;
  InstanceStatus status = 2;
  string error_message = 3;
}

message DeleteInstanceRequest {
  string id = 1;
}

message DeleteInstanceResponse {
  string id = 1;
  string error_message = 2;
}
