sonar.projectKey=tiny-aws
sonar.projectName=Tiny AWS
sonar.projectVersion=0.1.0

sonar.sources=control-plane,runtime,proto,docs
sonar.exclusions=**/gen/**,**/build/**,**/*.pb.go,**/*.pb.cc,**/*.pb.h,**/*_grpc.pb.go,**/*_grpc.pb.cc,**/*_grpc.pb.h,**/vendor/**

sonar.tests=control-plane,runtime/tests
sonar.test.inclusions=**/*_test.go,**/tests/**

sonar.sourceEncoding=UTF-8

# Go
sonar.go.coverage.reportPaths=control-plane/coverage.out

# C++ (when a coverage report exists)
# sonar.cfamily.compile-commands=runtime/build/compile_commands.json
