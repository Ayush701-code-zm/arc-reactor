sonar.organization=ayush701-code-zm
sonar.projectKey=Ayush701-code-zm_arc-reactor
sonar.projectName=arc-reactor
sonar.projectVersion=0.1.0

sonar.sources=control-plane,runtime,proto,docs
sonar.exclusions=**/gen/**,**/build/**,**/*.pb.go,**/*.pb.cc,**/*.pb.h,**/*_grpc.pb.go,**/*_grpc.pb.cc,**/*_grpc.pb.h,**/vendor/**,**/build-linux/**,**/scripts/**

# Localhost HTTP between tiny CLI and tinyd is intentional for M2 (loopback only).
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=**/cmd/tiny/main.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=**/cmd/tinyd/main.go

sonar.tests=control-plane,runtime/tests
sonar.test.inclusions=**/*_test.go,**/tests/**

sonar.coverage.exclusions=**/cmd/**,**/runtime/**,**/runtimeclient/**,**/proto/**,**/docs/**,**/gen/**

sonar.sourceEncoding=UTF-8

sonar.go.coverage.reportPaths=control-plane/coverage.out
